repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Pre-push hook: run unit tests locally before pushing. Same invocation CI
  # uses, so developers catch failures in 25s instead of waiting for a red PR.
  # Bypass with `git push --no-verify` if you've just run tests manually.
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest unit tests (pre-push)
        entry: uv run pytest tests/unit/ -x -q --no-cov
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Pre-commit: block Tier-1 gold-standard regressions and unapproved
      # docs/ folders before they land in a PR. Script inspects staged files
      # itself, so pass_filenames is false.
      - id: extraction-guard
        name: extraction/docs guard (Tier-1 regression + docs folder allowlist)
        entry: bash scripts/pre-commit-extraction-guard.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # Pre-commit: flag migrations with cluster-scoped DDL (CREATE/ALTER/DROP
      # on ROLE/USER/TABLESPACE/SUBSCRIPTION) that would race under parallel
      # migration apply (pytest-xdist per-worker DBs). See Issue #78. Files
      # containing the marker `-- cluster-ddl-ok: ...` are skipped.
      - id: cluster-ddl-guard
        name: cluster-scoped DDL guard (sql/ migrations)
        entry: bash scripts/pre-commit-cluster-ddl-guard.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^sql/.*\.sql$

      # Pre-commit: enforce the timestamp filename scheme for newly added
      # sql/ migrations (YYYYMMDDHHMM_description.sql). The legacy NN_
      # scheme caused parallel-branch prefix collisions (04, 08, 09, 10,
      # 11, 12, 46). Only checks added files — edits to legacy NN_*.sql
      # are unaffected. See .claude/rules/sql.md and scripts/new_migration.py.
      - id: migration-name-guard
        name: Migration filename scheme (timestamp for new files)
        entry: bash scripts/pre-commit-migration-name-guard.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^sql/.*\.sql$

      # Pre-commit: validate known-issue fragment frontmatter whenever a
      # fragment under docs/known-issues/ is staged. The rollup
      # (docs/KNOWN_ISSUES.md) is no longer tracked in git — CI regenerates
      # it as a build artifact — so there is no rollup-regen step here.
      - id: known-issues-validate
        name: Validate known-issue fragment frontmatter
        entry: python3 scripts/validate_known_issues_fragments.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: '^docs/known-issues/.*\.md$'

      - id: migration-order-check
        name: Migration order completeness
        entry: python3 scripts/check_migration_order.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(sql/.*\.sql$|scripts/apply_all_migrations\.py$)

      # Pre-commit: verify [text](path.md) links in docs/README.md still
      # resolve. The README is a navigation table; file moves silently break
      # links. See feedback_docs_link_check_after_moves (2026-04-27 cleanup
      # incident: 3 broken links landed on main).
      - id: docs-readme-links
        name: docs/README.md broken-link check
        entry: bash scripts/pre-commit-docs-readme-links.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^docs/.*\.md$
