repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Pre-push hook: run unit tests locally before pushing. Same invocation CI
  # uses, so developers catch failures in 25s instead of waiting for a red PR.
  # Bypass with `git push --no-verify` if you've just run tests manually.
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest unit tests (pre-push)
        entry: uv run pytest tests/unit/ -x -q --no-cov
        language: system
        pass_filenames: false
        stages: [pre-push]
