repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Pre-push hook: run unit tests locally before pushing. Same invocation CI
  # uses, so developers catch failures in 25s instead of waiting for a red PR.
  # Bypass with `git push --no-verify` if you've just run tests manually.
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest unit tests (pre-push)
        entry: uv run pytest tests/unit/ -x -q --no-cov
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Pre-commit: block Tier-1 gold-standard regressions and unapproved
      # docs/ folders before they land in a PR. Script inspects staged files
      # itself, so pass_filenames is false.
      - id: extraction-guard
        name: extraction/docs guard (Tier-1 regression + docs folder allowlist)
        entry: bash scripts/pre-commit-extraction-guard.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # Pre-commit: flag migrations with cluster-scoped DDL (CREATE/ALTER/DROP
      # on ROLE/USER/TABLESPACE/SUBSCRIPTION) that would race under parallel
      # migration apply (pytest-xdist per-worker DBs). See Issue #78. Files
      # containing the marker `-- cluster-ddl-ok: ...` are skipped.
      - id: cluster-ddl-guard
        name: cluster-scoped DDL guard (sql/ migrations)
        entry: bash scripts/pre-commit-cluster-ddl-guard.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^sql/.*\.sql$

      # Pre-commit: validate and regenerate the KNOWN_ISSUES.md rollup whenever
      # a fragment under docs/known-issues/ is staged OR the rollup itself is
      # staged (e.g. during a merge conflict resolution).  Validate runs first so
      # we never regenerate from invalid input.  The regenerator's --stage flag
      # auto-adds the rollup to the commit, so developers don't need to stage it
      # manually.  The rollup is byte-deterministic, so the hook never loops.
      - id: known-issues-validate
        name: Validate known-issue fragment frontmatter
        entry: python3 scripts/validate_known_issues_fragments.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: '^docs/known-issues/.*\.md$'

      - id: known-issues-rollup
        name: Regenerate KNOWN_ISSUES.md rollup from fragments
        entry: python3 scripts/regenerate_known_issues.py --stage
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: '^(docs/known-issues/.*|docs/KNOWN_ISSUES)\.md$'

      - id: migration-order-check
        name: Migration order completeness
        entry: python3 scripts/check_migration_order.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(sql/.*\.sql$|scripts/apply_all_migrations\.py$)
