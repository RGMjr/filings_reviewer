[pytest]
# pytest configuration for filings_reviewer project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.4

# Options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database)
    slow: Slow-running tests

# Integration test configuration
# Set TEST_DATABASE_URL environment variable or run scripts/setup_test_db.sh

# Logging
log_cli = true
log_cli_level = INFO
