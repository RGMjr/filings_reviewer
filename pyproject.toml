[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filings-reviewer"
version = "0.2.0"
description = "SEC filings analysis system for customer metrics disclosure assessment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "CMASB Team"}
]
keywords = ["sec", "edgar", "filings", "metrics", "disclosure", "s-1", "ipo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
llm = [
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
]

[project.urls]
Repository = "https://github.com/RGMjr/filings_reviewer"
Documentation = "https://github.com/RGMjr/filings_reviewer/tree/main/docs"

[project.scripts]
build-universe = "scripts.build_universe_real:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Minimum version
minversion = "7.4"

# Default options (coverage settings)
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=75",
]

# Test markers
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require database)",
    "slow: Slow-running tests",
    "benchmark: Performance benchmark tests",
]

# Logging
log_cli = true
log_cli_level = "INFO"

# Warnings
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | Archive
    | data
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "Archive",
    "data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
# Global settings
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive for most of the codebase
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
ignore_missing_imports = true

# Strict mode for review module
[[tool.mypy.overrides]]
module = "src.review.*"
disallow_untyped_defs = true
disallow_any_generics = true      # Require generic type parameters (e.g. Dict[str, Any])
warn_return_any = true            # Warn on Any returns
no_implicit_reexport = true       # Require explicit re-exports
warn_unused_ignores = true        # Clean up unused type: ignore comments
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_subclassing_any = false

# Exclude tests from strict mode
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false     # Tests don't require strict typing
check_untyped_defs = false        # Skip type inference in tests

# Exclude infra imports from strict checks (prevents scope creep)
[[tool.mypy.overrides]]
module = "src.infra.*"
follow_imports = "skip"           # Don't apply --strict to infra imports

# Exclude extraction imports from strict checks (prevents scope creep)
[[tool.mypy.overrides]]
module = "src.extraction.*"
follow_imports = "skip"           # Don't apply --strict to extraction imports
