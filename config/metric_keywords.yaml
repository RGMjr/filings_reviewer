# Metric Keywords Configuration
# ==============================
# This file defines the keyword patterns used to identify customer metrics in SEC filings.
#
# Structure:
#   metric_id:
#     tier: 1 (must-not-miss) or 2 (nice-to-have) — drives regression policy and prioritization
#     patterns: List of regex patterns (case-insensitive, use \b for word boundaries)
#     exclusions: Optional list of patterns that should NOT match this metric
#     specific_patterns: Optional list of multi-word patterns that get confidence bonus
#
# Notes:
# - All patterns are case-insensitive
# - Use \b for word boundaries to prevent partial matches
# - Use \s+ for flexible whitespace between words
# - Patterns are compiled with re.IGNORECASE
#
# To add a new metric:
# 1. Add a new metric_id key (use cm_ prefix for customer metrics)
# 2. Add patterns list with at least one regex pattern
# 3. Optionally add exclusions to prevent false positives
# 4. Optionally add specific_patterns for multi-word phrases that get bonus confidence

---
# =============================================================================
# Shared Context Requirements (YAML Anchors)
# =============================================================================
# Revenue synonym metrics require cohort or per-customer context to generate
# review candidates. Without this context, they are just revenue measures,
# not customer metrics. This anchor defines the shared context patterns.

_revenue_synonym_context: &revenue_synonym_context
  required_context:
    patterns:
      # Cohort keywords (from cohort_chart_detector.py)
      - '\bcohort\b'
      - '\bby\s+vintage\b'
      - '\bacquisition\s+year\b'
      - '\brevenue\s+(?:by|per)\s+cohort\b'
      - '\bretention\s+(?:by|per)\s+cohort\b'
      - '\bARR\s+(?:by|of\s+each)\s+cohort\b'
      - '\bLTV[/ ]CAC\b'
      # Per-customer keywords
      - '\bper\s+customer\b'
      - '\bper\s+user\b'
      - '\bper\s+account\b'
      - '\bper\s+subscriber\b'
      - '\bper\s+client\b'
      - '\baverage\s+per\b'
      - '\bby\s+customer\b'
      - '\bby\s+account\b'
      - '\bcustomer[- ]level\b'
      - '\baccount[- ]level\b'
    proximity_chars: 1500

# =============================================================================
# Core Metrics
# =============================================================================
# SEMANTIC DISTINCTIONS - Customer Count Metrics:
#   cm_customers_period_end: Stock count at period end ("total customers", "paid customers")
#   cm_active_customers_total: Engagement-based count ("active customers" - implies activity criteria)
#   These are DISTINCT metrics, not aliases. "Total" ≠ "Active"
# =============================================================================

cm_new_customers_acquired:
  tier: 1
  patterns:
    - '\bnew\s+customers?\b'
    - '\bcustomers?\s+acquired\b'
    - '\bcustomer\s+acquisition[s]?\b'
    - '\bacquired\s+customers?\b'
    - '\bnewly\s+acquired\b'
    - '\bnew\s+customer\s+additions?\b'
    - '\bnet\s+new\s+customers?\b'
    - '\bcustomers?\s+added\b'
    # Reversed-order phrasing: "we added approximately 1,400 customers"
    - '\badded\s+(?:approximately|roughly|about|nearly|over|more\s+than)\s+[\d,]+\s+(?:new\s+)?(?:customers?|users?|accounts?|subscribers?)\b'
    - '\bacquisition\s+of\s+customers?\b'
    - '\bnew\s+users?\s+acquired\b'
    - '\bacquired\s+users?\b'
    - '\bnew\s+accounts?\s+acquired\b'
    - '\bnew\s+clients?\s+acquired\b'
    - '\bnew\s+logos?\b'
    # Consumer synonyms (e-commerce terminology)
    - '\bnew\s+consumers?\b'
    - '\bconsumers?\s+acquired\b'
    - '\bconsumer\s+acquisition[s]?\b'
    - '\bacquired\s+consumers?\b'
    - '\bconsumers?\s+added\b'
    # Transcript vocabulary (telecom net adds, first-time users, new businesses)
    - '\bnet\s+(?:additions?|adds?)\b'
    - '\bnet\s+customer\s+additions?\b'
    - '\bfirst[- ]time\b[^.;]{0,40}\b(?:customers?|users?)\b'
    - '\bnew\s+(?:businesses|merchants)\b'
    # Transcript: telecom-specific "postpaid phone net adds/adding", "broadband net additions"
    - '\bpostpaid\s+(?:phones?\s+)?net\s+(?:customer\s+)?(?:additions?|adds?)\b'
    - '\bpostpaid\s+phones?\s+adding\b'
    - '\b(?:broadband|fiber|5g)\s+(?:net\s+)?(?:additions?|adds?)\b'
    # Transcript: "prepaid net adds" (telecom)
    - '\bprepaid\s+(?:net\s+)?(?:additions?|adds?)\b'
    # Transcript: "4 million new debit card actives" (PYPL)
    - '\bnew\b[^.;]{0,30}\bdebit\s+card\s+(?:actives?|users?)\b'
    # Transcript: gaming/entertainment vocabulary (EA)
    - '\bnew\s+fans?\b'
    - '\badding\s+(?:new\s+)?fans?\b'
    - '\bgrowing\s+(?:our\s+)?(?:audience|fan\s+base)\b'
  exclusions:
    - '\bacquisition\s+cost\b'
    - '\bcac\b'
    - '\bcost\s+to\s+acquire\b'
    # FIX-FP: Exclude numbers followed by non-metric units (applications, integrations)
    - '\b\d[\d,]*(?:\s+[\w-]+){0,2}\s+(?:applications?|integrations?)\b'
    # FIX-FP-STOCK: Stock inventory ("settled shares held exclusively for this program") is not
    # a new-customer acquisition count (Robinhood stock reward program)
    - '\b(?:settled\s+)?shares?\s+(?:held|of\s+stock|inventory)\b'

cm_customers_period_end:
  tier: 2
  # Period-end customer count (stock count at end of period)
  # Distinct from cm_active_customers_total which is engagement-based
  patterns:
    - '\bpaid\s+customers?\b'
    - '\bfree\s+(?:subscription\s+)?(?:plan\s+)?(?:organizations?|customers?)\b'
    - '\borganizations?\s+on\s+(?:our\s+)?free\s+(?:subscription\s+)?plan\b'
    - '\borganizations?\s+(?:with\s+)?(?:three|\d+)\s+(?:or\s+more\s+)?users?\b'
    - '\bcustomers?\s+\(?period\s*end\)?\b'
    - '\bend[- ]of[- ]period\s+customers?\b'
    - '\b(?:total\s+)?(?:paying|paid)\s+(?:organizations?|customers?)\b'
    # Total customer count patterns (moved from cm_active_customers_total 2026-01-07)
    # "Total customers" represents a stock count, not engagement-based "active" customers
    - '\btotal\s+customers?\b'
    - '\btotal\s+consumers?\b'
    - '\bcustomer\s+base\b'
    - '\bconsumer\s+base\b'
    - '\btotal\s+accounts?\b'
    - '\btotal\s+clients?\b'
    # Transcript vocabulary (telecom: subscriber counts — NOT net additions which are flow metrics)
    # REMOVED: postpaid net additions pattern (moved to cm_new_customers_acquired — it's a flow metric)
    - '\bsubscriber\s+(?:count|base)\b'
    # Transcript: prepaid customers/subscribers, commercial seats, consumer subscriptions
    - '\bprepaid\s+(?:customers?|subscribers?)\b'
    - '\bcommercial\s+seats?\b'
    - '\bconsumer\s+subscriptions?\b'
    # Transcript: "1.4 million security customers" — bare "N [adj] customers" with magnitude
    - '\b(?:million|billion|thousand)\s+(?:\w+\s+){0,3}customers?\b'
    # Transcript: "15 million GitHub Copilot users" — "N [adj] users" with magnitude (0-3 words)
    - '\b(?:million|billion|thousand)\s+(?:\w+\s+){0,3}users?\b'
    # Transcript: "organizations have used/now use/have already used" (MSFT)
    # Note: em dashes in text (e.g., "organizations – including X – have used") require
    # a looser pattern that skips intervening content
    - '\borganizations?\b[^.]{0,100}\b(?:used?|adopted)\b'
    # Transcript: "70,000 enterprises" (MSFT Foundry)
    - '\b\d[\d,.]*\s+(?:\w+\s+){0,2}enterprises?\b'
    # Transcript: "paid subscriptions grew" (ADBE)
    - '\bpaid\s+subscriptions?\b'
    # Transcript: gaming vocabulary — "players have signed up" (EA Labs)
    - '\bplayers?\s+(?:have\s+)?signed\s+up\b'
    - '\bsigned\s+up\b[^.;]{0,30}\bplayers?\b'
    # Gitlab-style: "Base Customers" is the company's term for their primary paid customer cohort
    - '\bbase customers?\b'
    # Kingsoft-style: "Number of Premium Customers" / "Number of Public Cloud Service Premium Customers"
    # Uses "number of" prefix to avoid matching running-text mentions of "premium customers" that
    # appear near revenue figures. Paired with removal of "premium" from the exclusion list below.
    - '\bnumber\s+of\s+(?:\w+\s+)*premium\s+customers?\b'
  exclusions:
    - '\bretention\s+rate\b'
    - '\bnet\s+dollar\s+retention\b'
    - '\bndr\b'
    - '\bnrr\b'
    - '\b\d+%\s*(?:as\s+of|for|during)\b'
    # FIX-3: Exclude word-form numbers in non-customer contexts (languages, time periods, etc.)
    - '\b(?:eight|twelve|ten)\s+(?:languages?|months?|countries?|weeks?|days?)\b'
    - '\btrailing\s+twelve\s+months?\b'
    - '\bavailable\s+in\s+\w+\s+(?:languages?|countries?)\b'
    # FIX-FP: Exclude numbers followed by time units (e.g., "50 million hours")
    - '\b\d[\d,]*(?:\s+[\w-]+){0,2}\s+(?:hours?)\b'
    # FIX-FP: monthly/daily active users/people belong to MAU/DAU metrics, not stock count
    - '\b(?:monthly|daily)\s+active\s+(?:users?|people)\b'
    # FIX-FP: Salesforce "trailblazers" are community members, not paying customers
    - '\btrailblazers?\b'
    # FIX-FP: Exclude supplier/geography counts (e.g., "190 countries", "980 sellers")
    - '\b\d[\d,.]*(?:\s+(?:million|billion|thousand|luxury|leading|different))?\s+(?:countries|sellers|retailers|brands|boutiques|suppliers|merchants|partners|stores|locations)\b'
    # FIX-B3: Exclude Fortune list references (e.g., "65 companies in the Fortune 100")
    - 'fortune\s+\d+'
    # FIX-FP-FEATURESUBSET: Product/feature-qualified subset counts are not total customer counts
    # e.g. "1.6M Gold customers", "16.4M crypto customers" (Robinhood)
    # Note: "premium" removed — Kingsoft uses "Premium Customers" as their main customer category
    - '\b(?:gold|crypto)\s+(?:customers?|users?|subscribers?)\b'
    - '\b(?:newsfeeds?|watchlists?|cash\s+management)\s+(?:users?|customers?)\b'
    # FIX-FP-NPS: Net Promoter Score values are satisfaction scores, not customer counts
    - '\bnet\s+promoter\s+score\b'
    - '\bnps\b'
    # FIX-FP-EMPLOYEE: Employee counts near customer keywords are not customer counts
    - '\b\d[\d,.]*(?:\s+(?:million|billion|thousand))?\s+employees?\b'
    # FIX-FP-MARGIN: Margin borrowers/receivables are financial balances, not customer counts (Robinhood)
    - '\bmargin\s+(?:borrowers?|receivables?|balance)\b'
    # FIX-FP-FEATURESUBSET2: Feature user counts by name (Robinhood newsfeeds, watchlists)
    - '\bnewsfeed\b'
    - '\bwatchlists?\b'
    # FIX-FP-ARR-THRESHOLD: "$1.0 million ARR customers" — "million" is a $ threshold, not a count magnitude
    # Prevents the magnitude pattern above from firing on ARR-tier customer descriptions (Gitlab)
    - '\$\d+(?:\.\d+)?\s+(?:million|billion)\s+arr\b'
  specific_patterns:
    - 'paid\s+customers?'
    - 'paying\s+customers?'
    - 'total\s+customers?'
    - 'total\s+consumers?'
    - 'customer\s+base'

cm_large_customers_period_end:
  tier: 1
  patterns:
    - '\bpaid\s+customers?\s*>\s*\$[\d,]+'
    - '\bcustomers?\s*>\s*\$\d+(?:,\d+)*\s*(?:of\s+)?(?:arr|annual\s+recurring\s+revenue)\b'
    - '\blarge\s+(?:enterprise\s+)?customers?\b'
    - '\benterprise\s+customers?\b'
    - '\$\d+(?:,\d+)*(?:k|K)?\+?\s*arr\s+customers?\b'
    - '\bcustomers?\s+(?:with\s+)?(?:over|above|greater\s+than|>)\s*\$[\d,]+'
    - '\bpaid\s+customers?\s+(?:with|of)\s+\$[\d,]+\s*(?:\+|or\s+more)?'
    # Transcript: "400 deals over $1 million" (CRM) — require $ sign to avoid extracting
    # the deal count (400) or the non-dollar threshold ("deals over a million")
    - '\bdeals?\s+over\s+\$'
    # Snowflake-style phrasing: "customers with trailing 12-month product revenue greater than $X"
    - '\bcustomers?\s+with\s+trailing\s+\d+[- ]month\s+(?:\w+\s+)*revenue\s+(?:greater\s+than|more\s+than|over|above|exceeding|>)\s*\$'
    # Snowflake narrative: "customers that contributed more than $X million in trailing..."
    - '\bcustomers?\s+(?:that\s+)?contributed\s+(?:more\s+than|over|above)\s+\$'
    # Samsara: "customers representing over $100,000 in ARR"
    - '\bcustomers?\s+representing\s+(?:over|above|more\s+than|greater\s+than)\s*\$'
    # Gitlab: "$1.0 million ARR customers" — decimal + word multiplier threshold
    - '\$\d+(?:\.\d+)?\s*(?:million|billion|mil|bn)\s+arr\s+customers?\b'
    # Samsara: "exceeded $1,000 in ARR" / "exceeding $100,000"
    - '\bcustomers?\s+(?:that\s+)?(?:exceeded|exceeding)\s+\$'
    # Transcript: "900,000 have 4 or more workloads" (MSFT) — customers using multiple products
    - '\bhave\s+\d+\s+or\s+more\s+workloads?\b'
  exclusions:
    - '\bretention\s+rate\b'
    - '\bnet\s+dollar\s+retention\b'
    - '\bndr\b'
    - '\bnrr\b'
    - '\b\d+%\s*(?:as\s+of|for|during)\b'
  specific_patterns:
    - 'enterprise\s+customers?'
    - 'large\s+customers?'
    - 'customers?\s+with\s+trailing'
    - 'customers?\s+(?:that\s+)?contributed'
    - 'customers?\s+representing'

cm_customers_period_end_by_tenure:
  tier: 1
  patterns:
    - '\bcustomers?\s+by\s+tenure\b'
    - '\btenure\s+cohort\b'
    - '\bcustomers?\s+at\s+period\s+end\b'
    - '\bby\s+age\b'
    - '\btime\s+since\b'

cm_revenue_by_cohort:
  tier: 1
  patterns:
    - '\brevenue\s+by\s+cohort\b'
    - '\bcohort\s+revenue\b'
    - '\brevenue[^.;]{0,100}\bcohort\b'
    - '\bcohort[^.;]{0,100}\brevenue\b'
    - '\bgmv[^.;]{0,100}\bcohort\b'
    - '\bcohort[^.;]{0,100}\bgmv\b'
    - '\bgross\s+merchandise\s+(?:value|volume)[^.;]{0,100}\bcohort\b'
    # Existing/new customer revenue split (e.g., "94% of revenue derived from existing customers")
    - '\brevenue[^.;]{0,80}(?:from|derived\s+from)\s+(?:existing|new)\s+customers?\b'
    - '\b(?:existing|new)\s+customers?[^.;]{0,80}\brevenue\b'

cm_transactions_by_cohort:
  tier: 1
  patterns:
    - '\btransactions?\s+by\s+cohort\b'
    - '\bcohort\s+transactions?\b'
    - '\btransactions?[^.;]{0,100}\bcohort\b'
    # Orders variants for Farfetch terminology (orders = transactions)
    - '\borders?\s+by\s+cohort\b'
    - '\bcohort\s+orders?\b'
    - '\bnumber\s+of\s+orders?[^.;]{0,50}\bcohort\b'
  # NOTE: Plain 'number of orders' (without cohort) in cm_purchase_transactions_overall

cm_purchase_transactions_overall:
  tier: 2
  patterns:
    - '\bnumber\s+of\s+orders?\b'
    - '\btotal\s+orders?\b'
    - '\bpurchase\s+transactions?\b(?!\s+by\s+cohort)'
    - '\border\s+count\b'
    - '\border\s+volume\b'
    - '\borders?\s+fulfil'
  exclusions:
    - '\bby\s+cohort\b'
    - '\bby\s+vintage\b'
  specific_patterns:
    - 'number\s+of\s+orders?'

# =============================================================================
# Extended Metrics
# =============================================================================

cm_active_customers_total:
  tier: 2
  # "Active" customers implies engagement-based measurement (e.g., logged in, made purchase)
  # Distinct from "total" customers which is a simple headcount at period end
  # "Total" patterns moved to cm_customers_period_end (2026-01-07)
  patterns:
    - '\bactive\s+customers?\b'
    - '\bactive\s+consumers?\b'
    - '\bactive\s+accounts?\b'
    - '\bactive\s+clients?\b'
    - '\bactive\s+users?\b'
    - '\bactive\s+subscribers?\b'
    # Transcript vocabulary (telecom/gaming)
    - '\bmonthly\s+active\s+unique\s+accounts?\b'
    - '\blive\s+services?\s+players?\b'
    - '\bpostpaid\b[^.;]{0,30}\bcustomers?\b(?!\s*(?:net|additions?|adds?))'
    # Transcript: "One billion professionals use LinkedIn" (MSFT)
    - '\bprofessionals?\s+use\b'
    # Transcript: "100 million people use WhatsApp" (META)
    - '\bpeople\s+use\b'
    # Transcript: gaming vocabulary — magnitude-gated to reduce sports FP risk (EA)
    - '\b(?:million|billion|thousand)\s+(?:\w+\s+){0,2}players?\b'
  exclusions:
    # FIX-FP: Exclude numbers followed by non-metric units (hours, countries, languages)
    - '\b\d[\d,]*(?:\s+[\w-]+){0,2}\s+(?:hours?|countries?|languages?)\b'
    # FIX-FP: DAU/MAU context belongs to dedicated metrics, not generic "active"
    - '\bdaily\s+active\b'
    - '\bmonthly\s+active\b'
    # FIX-FP: Postpaid net additions/adds belong to cm_customers_period_end
    - '\bpostpaid\b[^.;]{0,30}\bnet\s+(?:additions?|adds?)\b'
    # FIX-FP: Reactivated players are win-back metrics, not active customer counts (EA)
    - '\breactivated\b'
    # FIX-FP-FEATURESUBSET: Product/feature-qualified subset counts are not total active customer counts
    - '\b(?:gold|premium|crypto)\s+(?:customers?|users?|subscribers?)\b'
    - '\b(?:newsfeeds?|watchlists?|cash\s+management)\s+(?:users?|customers?)\b'
  specific_patterns:
    - 'active\s+customers?'
    - 'active\s+consumers?'
    - 'active\s+accounts?'

cm_revenue_per_customer:
  tier: 2
  patterns:
    - '\barpu\b'
    - '\baverage\s+revenue\s+per\s+user\b'
    - '\brevenue\s+per\s+customer\b'
    - '\brevenue\s+per\s+user\b'
    - '\bper\s+customer\s+revenue\b'
    # Chewy-style: "net sales per active customer"
    - '\bnet\s+sales\s+per\s+(?:active\s+)?customer\b'
    - '\bsales\s+per\s+(?:active\s+)?customer\b'
    # Transcript vocabulary (telecom)
    - '\barpa\b'
    - '\baverage\s+revenue\s+per\s+account\b'
    # Telecom ARPU variants
    - '\bpostpaid\s+arpu\b'
    - '\bbroadband\s+arpu\b'
    - '\bprepaid\s+arpu\b'
    # Telecom: average margin per user (close substitute for ARPU in some carriers)
    - '\bampu\b'
    # Kingsoft Cloud: "average revenues per Public/Enterprise Cloud Service Premium Customer"
    - '\baverage\s+revenues?\s+per\s+(?:\w+\s+){0,4}premium\s+customer\b'
  exclusions:
    - '\bcost\s+per\s+customer\b'
    - '\bcost\s+per\s+user\b'
  specific_patterns:
    - 'average\s+revenue\s+per'

cm_customer_acquisition_cost:
  tier: 1
  patterns:
    - '\bcac\b'
    - '\bcustomer\s+acquisition\s+cost\b'
    - '\bacquisition\s+cost\b'
    - '\bcost\s+to\s+acquire\b'
    # Consumer synonyms (e-commerce terminology)
    - '\bconsumer\s+acquisition\s+cost\b'
  exclusions:
    - '\bcontribution\s+margin\b'
    - '\bgross\s+margin\b'
    - '\bprofit\s+margin\b'
    - '\boperating\s+margin\b'
    - '\bplatform\s+order\s+contribution\b'
  specific_patterns:
    - 'customer\s+acquisition\s+cost'
    - 'consumer\s+acquisition\s+cost'

cm_cac_payback_period:
  tier: 2
  patterns:
    - '\bcac\s+payback\b'
    - '\bpayback\s+period\b'
    - '\btime\s+to\s+recover\b'
    - '\bpayback\s+period\s+(?:on|for)\s+cac\b'
  specific_patterns:
    - 'payback period on CAC'
    - 'CAC payback period'

cm_customer_retention_rate:
  tier: 1
  patterns:
    - '\bretention\s+rate\b'
    - '\bcustomer\s+retention\b'
    - '\bretained\s+customers?\b'
    # Consumer synonyms (e-commerce terminology)
    - '\bconsumer\s+retention\b'
    - '\bretained\s+consumers?\b'
    # Transcript: "retention above 85%" (GDDY)
    - '\bretention\s+above\b'
    # Transcript: "continuing strong renewal rates" (ADSK)
    - '\brenewal\s+rates?\b'
  exclusions:
    - '\brevenue\s+retention\b'
    - '\bdollar\s+retention\b'
    - '\bnrr\b'
    - '\bgrr\b'
    # FIX-FN: "dollar-based retention" belongs to NRR, not CRR
    - '\bdollar[- ]?based\s+retention\b'

cm_customer_churn_rate:
  tier: 2
  patterns:
    - '\bchurn\s+rate\b'
    - '\bcustomer\s+churn\b'
    - '\battrition\s+rate\b'
    # Consumer synonyms (e-commerce terminology)
    - '\bconsumer\s+churn\b'
    - '\bconsumer\s+attrition\b'
    # Transcript vocabulary (telecom)
    - '\bpostpaid\b[^.;]{0,30}\bchurn\b'
    # Transcript: "revenue attrition" (CRM)
    - '\brevenue\s+attrition\b'

cm_net_revenue_retention:
  tier: 1
  patterns:
    - '\bnrr\b'
    - '\bnet\s+revenue\s+retention\b'
    - '\bnet\s+retention\b'
    - '\bnet\s+dollar\s+retention\b'
    - '\bndr\b'
    - '\bnet\s+retention\s+rate\b'
    # FIX-FN: Flywire "net dollar-based retention rate" / "dollar-based retention rate"
    - '\bdollar[- ]?based\s+(?:net\s+)?retention\b'
  exclusions:
    - 'we\s+(?:calculate|define|compute|measure)\b'
    - 'calculated\s+(?:as|by)\b'
    # FIX-FP: Suppress geographic scope counts (countries, currencies, languages)
    - '\b(?:countr(?:y|ies)|currenc(?:y|ies)|languages?)\b'
  specific_patterns:
    - 'net\s+revenue\s+retention'
    - 'net\s+dollar\s+retention'

cm_gross_revenue_retention:
  tier: 1
  patterns:
    - '\bgrr\b'
    - '\bgross\s+revenue\s+retention\b'
    - '\bgross\s+retention\b'
  specific_patterns:
    - 'gross\s+revenue\s+retention'

cm_monthly_active_users:
  tier: 2
  patterns:
    - '\bmau\b'
    - '\bmonthly\s+active\s+users?\b'
    # Transcript vocabulary (Meta/Facebook)
    - '\bpeople\s+using\b[^.;]{0,30}\bmonthly\b'
    - '\bmonthly\s+active\s+people\b'
    - '\bmap\b(?=\s+(?:was|were|reached|grew|increased|declined|of|across))'
    - '\bfamily\s+of\s+apps\b[^.;]{0,50}\bmonthly\b'
    # Transcript: shorthand "monthly actives" (META), "monthly active accounts" (PYPL)
    - '\bmonthly\s+actives?\b'
    - '\bmonthly\s+active\s+accounts?\b'
    # Transcript: "a billion people each month" (META)
    - '\bpeople\b[^.;]{0,50}\beach\s+month\b'
    # Transcript: "MAAs grew 30%" (PYPL monthly active accounts shorthand)
    - '\bMAAs?\b'
    # Transcript: "monthly active usage growing 23%" (ADBE)
    - '\bmonthly\s+active\s+usage\b'
  specific_patterns:
    - 'monthly\s+active\s+users?'
    - 'monthly\s+active\s+people'

cm_daily_active_users:
  tier: 2
  patterns:
    - '\bdau\b'
    - '\bdaily\s+active\s+users?\b'
    # Transcript vocabulary (Meta/Facebook)
    - '\bpeople\s+using\b[^.;]{0,30}\bdaily\b'
    - '\bdaily\s+active\s+people\b'
    - '\bdap\b'
    # Transcript: "3.4 billion people...each day", "people used...daily basis"
    - '\bpeople\b[^.;]{0,50}\beach\s+day\b'
    - '\bpeople\s+used?\b[^.;]{0,50}\bdaily\s+basis\b'
  exclusions:
    # FIX-FP: Exclude numbers followed by non-metric units (applications, countries, languages)
    - '\b\d[\d,]*(?:\s+[\w-]+){0,2}\s+(?:applications?|countries?|languages?|integrations?)\b'
  specific_patterns:
    - 'daily\s+active\s+users?'
    - 'daily\s+active\s+people'

cm_balance_by_cohort:
  tier: 1
  # Robinhood-specific: cumulative net deposits tracked per acquisition cohort
  patterns:
    - '\bcumulative\s+net\s+deposits?\s+by\s+(?:annual\s+)?cohort\b'
    - '\baverage\s+(?:balance\s+of\s+)?cumulative\s+net\s+deposits?\b'
    - '\bcumulative\s+net\s+deposits?\b[^.;]{0,80}\bcohort\b'
    - '\bcohort\b[^.;]{0,80}\bcumulative\s+net\s+deposits?\b'
  specific_patterns:
    - 'cumulative\s+net\s+deposits?\s+by\s+(?:annual\s+)?cohort'
    - 'average\s+(?:balance\s+of\s+)?cumulative\s+net\s+deposits?'

cm_gross_margin_by_cohort:
  tier: 1
  # Only patterns that explicitly require "cohort" or "vintage" context
  # REMOVED (2026-01-02): '\border\s+contribution\s+margin\b' and
  # '\bplatform\s+order\s+contribution(?:\s+margin)?\b' - not cohort-specific
  # ADDED BACK (2026-02-09): Order Contribution Margin with cohort context qualifier
  patterns:
    - '\bgross\s+margin\s+by\s+cohort\b'
    - '\bcohort\s+(?:gross\s+)?margin\b'
    - '\bmargin\s+by\s+(?:acquisition\s+)?(?:vintage|cohort)\b'
    # Order Contribution Margin only when cohort context (new/existing consumers) is nearby
    - '\border\s+contribution\s+margin[^.;]{0,80}\b(?:new|existing|cohort|consumer|customer)\b'
    - '\b(?:new|existing)\s+(?:consumer|customer)[^.;]{0,80}\border\s+contribution\s+margin\b'
  specific_patterns:
    - 'contribution\s+margin\s+by\s+cohort'
    - 'cohort\s+contribution\s+margin'

cm_arr:
  tier: 2
  status: deprecated
  patterns:
    - '\barr\b'
    - '\bannual\s+recurring\s+revenue\b'
    - '\bannualized\s+recurring\s+revenue\b'
    - '\bannual\s+run[- ]?rate\b'
  specific_patterns:
    - 'annual\s+recurring\s+revenue'

cm_mrr:
  tier: 2
  status: deprecated
  patterns:
    - '\bmrr\b'
    - '\bmonthly\s+recurring\s+revenue\b'
  specific_patterns:
    - 'monthly\s+recurring\s+revenue'

cm_expansion_revenue:
  tier: 1
  status: deprecated  # not a customer-level metric; zero GS coverage across all datasets
  patterns:
    - '\bexpansion\s+revenue\b'
    - '\bcross[- ]sell\b'
    - '\bupsell\b'
    - '\bproducts?\s+per\s+customer\b'
    - '\baverage\s+products?\s+owned\b'
    - '\bexpand\b[^.;]{0,100}\brevenue\b'
    # Transcript: "transactions per active account" (PYPL)
    - '\btransactions?\s+per\s+(?:active\s+)?account\b'
    - '\badditional\s+products?\b'
    - '\bmulti[- ]product\b'

cm_revenue_concentration:
  tier: 1
  patterns:
    - '\brevenue\s+concentration\b'
    - '\bcustomer\s+concentration\b'
    - '\btop\s+\d+\s+customers?\b'
    - '\blargest\s+customers?\b'
    # REMOVED (2026-04-02): '\b\d+%\s+of\s+revenue\b' — too broad; matched financial
    # margin/EBITDA percentages (e.g. "74% of revenue" = gross margin, not concentration)
    - '\bconcentration\s+risk\b'
    - '\bconcentration\s+of\s+revenue\b'
    - '\bmajor\s+customers?\b'
    - '\bcustomer\s+[A-D]\b'
    # Snowflake-style: "contributed approximately X% of our revenue"
    - '\bcontributed\s+(?:approximately\s+)?\d+%'
    # Snowflake-style: "representing approximately X% of our [product] revenue"
    - '\brepresenting\s+(?:approximately\s+)?\d+%[^.;]{0,30}\brevenue\b'
    # Snowflake-style: "represented X% or more of revenue"
    - '\brepresented\s+\d+%\s+or\s+more\s+of\s+revenue\b'
    # Snowflake-style: "generated X% of our revenue"
    - '\bgenerated\s+\d+%\s+of\s+(?:our\s+)?revenue\b'
    # FIX-FN: Tenable-style "[distributor/customer] accounted for X% of revenue"
    # Requires customer/distributor context before "accounted for" to avoid segment revenue FPs
    - '\b(?:distributor[s]?|reseller[s]?|customer[s]?|client[s]?)\b[^.;]{0,100}\baccounted\s+for\s+(?:approximately\s+)?\d+%'
    # FIX-FN: Samsara-style "X% of our ARR came from customers representing over $100K"
    - '\b\d+%\s+of\s+(?:our\s+)?ARR\s+came\s+from\s+customers\b'
  exclusions:
    # FIX-FP: Exclude business segment revenue share (not customer concentration)
    - '\b(?:fulfilment|fulfillment|marketplace|in-store|platform)\s+revenue\b'
    - '\bsource\s+of\b[^.;]{0,40}\brevenue\b'
    - '\brevenue\s+(?:from|generated\s+by)\s+(?:our\s+)?(?:platform|marketplace|fulfilment|fulfillment)\b'
    - '\bno\s+(?:individual|single)\b'
    # FIX-FP: Exclude negative assertions ("No customer accounted for more than X%")
    - '\bno\s+customer\b'
    - '\bdid\s+not\s+(?:exceed|comprise)\b'
    - '\bin\s+excess\s+of\b'
    # FIX-FP: Exclude accounts receivable concentration (not revenue concentration)
    - '\baccounts\s+receivable\b'

