# =============================================================================
# Customer Value Metrics
# =============================================================================

cm_lifetime_value_per_customer:
  tier: 1
  patterns:
    - '\bltv\b'
    - '\blifetime\s+value\b'
    - '\bcustomer\s+lifetime\s+value\b'
    - '\bclv\b'
    # Consumer synonyms and alternate phrasings
    - '\bconsumer\s+lifetime\s+value\b'
    - '\blifetime\s+value\s+of\s+a\s+(?:customer|consumer)\b'
  exclusions:
    - '\bltv\s*/\s*cac\b'
    - '\bltv\s+to\s+cac\b'
    - '\blifetime\s+value\s+to\s+(?:customer\s+)?acquisition\s+cost\b'
    # FIX-FP-VOLUNTEER: Nonprofit/volunteer counts are not LTV values (Chewy)
    - '\bvolunteer\b'
  specific_patterns:
    - 'lifetime\s+value'
    - 'customer\s+lifetime\s+value'
    - 'consumer\s+lifetime\s+value'
    - 'lifetime\s+value\s+of\s+a'

cm_ltv_to_cac_ratio:
  tier: 1
  patterns:
    - '\bltv\s*[:/]\s*cac(?:\s+ratio)?\b'
    - '\bltv\s+to\s+cac(?:\s+ratio)?\b'
    - '\blifetime\s+value\s+to\s+acquisition\s+cost\b'
  specific_patterns:
    - 'ltv\s*[:/]\s*cac\s+ratio'
    - 'ltv\s+to\s+cac\s+ratio'
    - 'lifetime\s+value\s+to\s+acquisition\s+cost'

cm_ltv_to_cac_ratio_by_cohort:
  tier: 1
  # LTV/CAC ratio analyzed by acquisition cohort (added 2026-01-07)
  # Updated 2026-02-09: Added temporal cohort patterns and widened proximity window
  patterns:
    - '\bltv\s*[:/]\s*cac\s+by\s+cohort\b'
    - '\bltv\s+to\s+cac\s+(?:ratio\s+)?by\s+cohort\b'
    - '\bcohort\s+ltv\s*[:/]\s*cac\b'
    # Widened from 50 to 80 chars to capture "LTV/CAC ratio for the years ended...cohorts"
    - '\bltv[:/]cac[^.;]{0,80}\bcohort\b'
    - '\bcohort[^.;]{0,80}\bltv[:/]cac\b'
    # Temporal prefix: "Six month LTV/CAC ratio", "12 month LTV/CAC ratio"
    - '\b(?:\d+|six|twelve|twenty[- ]?four)\s+months?\s+ltv\s*[:/]\s*cac\b'
    # Temporal suffix: "LTV/CAC after 6 months"
    - '\bltv\s*[:/]\s*cac\s+after\s+\d+\s+months?\b'
  specific_patterns:
    - 'ltv\s*[:/]\s*cac\s+by\s+cohort'
    - 'cohort\s+ltv\s*[:/]\s*cac'
    - 'ltv\s*[:/]\s*cac\s+after\s+\d+\s+months?'

