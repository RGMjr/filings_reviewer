few_shot_examples:
- text: We calculate Net Dollar Retention Rate as of a period end by starting with
    the MRR from all Paid Customers as of twelve months prior to such period end,
    or Prior Period MRR. We then calculate the MRR from these same Paid Customers
    as of the current period end, or Current Period MRR. Current Period MRR includes
    expansion within Paid Customers and is net of contraction or attrition over the
    trailing twelve months, but excludes revenue from new Paid Customers in the current
    period, including those organizations that were only on Free subscription plans
    in the prior period and converted to paid subscription plans during the current
    period. We then divide the total Current Period MRR by the total Prior Period
    MRR to arrive at our Net Dollar Retention Rate.
