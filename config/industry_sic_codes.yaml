# Industry SIC code mappings for scripts/onboard_tickers.py.
#
# Maps everyday industry names to SEC Standard Industrial Classification (SIC) codes.
# SIC reference (live): https://www.sec.gov/corpfin/division-of-corporation-finance-standard-industrial-classification-sic-code-list
# Codes verified against SEC's published list on 2026-04-19.
#
# Codes are stored as strings to match companies.industry_code (TEXT) in
# sql/01_create_schema.sql. Every code must be a 4-digit numeric string.
#
# To add an industry: append under `industries:` with a description and list of
# 4-digit SIC codes. Add common alternate names under `aliases:`.
# Only codes that appear in SEC's published list should be added — other codes
# are never assigned to `companies.industry_code` by the pipeline.
#
# The /ingest/ UI surfaces an additional "Other (uncategorised)" pseudo-industry
# that captures filings whose ``companies.industry_code`` is NULL or is not
# present in any bucket below — selecting every named industry plus "Other" is
# equivalent to no industry filter at all. The sentinel key is ``__other__``
# (``OTHER_INDUSTRY_KEY`` in src/universe/onboarding.py); it must never
# collide with a real industry name added here.

industries:
  software:
    description: "Prepackaged software and computer services"
    sic_codes:
      - "7370"  # SERVICES-COMPUTER PROGRAMMING, DATA PROCESSING, ETC.
      - "7371"  # SERVICES-COMPUTER PROGRAMMING SERVICES
      - "7372"  # SERVICES-PREPACKAGED SOFTWARE
      - "7373"  # SERVICES-COMPUTER INTEGRATED SYSTEMS DESIGN
      - "7374"  # SERVICES-COMPUTER PROCESSING & DATA PREPARATION
      - "7377"  # SERVICES-COMPUTER RENTAL & LEASING

  grocery_retail:
    description: "Grocery and food stores"
    sic_codes:
      - "5411"  # RETAIL-GROCERY STORES
      # Source: SEC SIC list https://www.sec.gov/corpfin/division-of-corporation-finance-standard-industrial-classification-sic-code-list
      # Codes verified 2026-04-19.

  industrial_services:
    description: "Industrial and commercial services"
    sic_codes:
      - "7389"  # SERVICES-SERVICES, NEC (covers broad industrial / commercial services)
      # Source: SEC SIC list https://www.sec.gov/corpfin/division-of-corporation-finance-standard-industrial-classification-sic-code-list
      # Codes verified 2026-04-19.
      # Additional codes may be appended here as needed (e.g. 7380 for
      # miscellaneous business services, 7382 for home security services).

  saas_cloud:
    description: "SaaS and cloud software platforms"
    sic_codes:
      - "7372"  # SERVICES-PREPACKAGED SOFTWARE
      - "7371"  # SERVICES-COMPUTER PROGRAMMING SERVICES
      - "7374"  # SERVICES-COMPUTER PROCESSING & DATA PREPARATION
      - "7379"  # SERVICES-SERVICES-COMPUTER RELATED SERVICES, NEC
      - "7370"  # SERVICES-COMPUTER PROGRAMMING, DATA PROCESSING, ETC.

  fintech_payments:
    description: "Financial technology, payments, and lending platforms"
    sic_codes:
      - "6099"  # FUNCTIONS RELATED TO DEPOSITORY BANKING, NEC
      - "6141"  # PERSONAL CREDIT INSTITUTIONS
      - "6153"  # SHORT-TERM BUSINESS CREDIT INSTITUTIONS, EXCEPT AGRICULTURAL
      - "6159"  # FEDERAL-SPONSORED CREDIT AGENCIES — NOT CHARTERED (used by some non-bank lenders)
      - "6199"  # FINANCE SERVICES
      - "7389"  # SERVICES-SERVICES, NEC (payment processing platforms)
      - "6211"  # SECURITY BROKERS, DEALERS & FLOTATION COMPANIES

  marketplace_ecommerce:
    description: "Online marketplaces and e-commerce platforms"
    sic_codes:
      - "5961"  # RETAIL-CATALOG & MAIL-ORDER HOUSES
      - "5999"  # RETAIL STORES, NEC
      - "7389"  # SERVICES-SERVICES, NEC (marketplace platform services)
      - "5940"  # SPORTING GOODS STORES & BICYCLE SHOPS
      - "5900"  # RETAIL-RETAIL STORES, NEC

  healthtech_digital_health:
    description: "Healthcare IT, digital health, and health information platforms"
    sic_codes:
      - "7372"  # SERVICES-PREPACKAGED SOFTWARE (health IT software)
      - "8099"  # HEALTH SERVICES, NEC
      - "8049"  # OFFICES & CLINICS OF OTHER HEALTH PRACTITIONERS
      - "8011"  # OFFICES & CLINICS OF DOCTORS OF MEDICINE
      - "8000"  # HEALTH SERVICES
      - "5047"  # WHOLESALE-MEDICAL & HOSPITAL EQUIPMENT & SUPPLIES

  cybersecurity:
    description: "Cybersecurity software and managed security services"
    sic_codes:
      - "7382"  # SERVICES-HOME SECURITY SERVICES INC
      - "7372"  # SERVICES-PREPACKAGED SOFTWARE (security software)
      - "7371"  # SERVICES-COMPUTER PROGRAMMING SERVICES
      - "7379"  # SERVICES-SERVICES-COMPUTER RELATED SERVICES, NEC

  data_analytics:
    description: "Data management, analytics, and business intelligence platforms"
    sic_codes:
      - "7372"  # SERVICES-PREPACKAGED SOFTWARE (analytics platforms)
      - "7374"  # SERVICES-COMPUTER PROCESSING & DATA PREPARATION
      - "7379"  # SERVICES-SERVICES-COMPUTER RELATED SERVICES, NEC
      - "7389"  # SERVICES-SERVICES, NEC (data services)

  consumer_internet:
    description: "Consumer internet, social, and digital media platforms"
    sic_codes:
      - "7375"  # SERVICES-COMPUTER RENTAL & LEASING, NEC (internet platforms)
      - "7372"  # SERVICES-PREPACKAGED SOFTWARE (consumer apps)
      - "4813"  # TELEPHONE COMMUNICATIONS (NO RADIO TELEPHONE)
      - "7812"  # SERVICES-MOTION PICTURE, VIDEOTAPE PRODUCTION
      - "7941"  # PROFESSIONAL SPORTS CLUBS
      - "7389"  # SERVICES-SERVICES, NEC (digital media)

  edtech:
    description: "Educational technology and online learning platforms"
    sic_codes:
