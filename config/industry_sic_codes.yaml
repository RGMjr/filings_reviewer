      - "4213"  # TRUCKING, EXCEPT LOCAL
      - "4215"  # COURIER SERVICES (NO AIR)
      - "4731"  # FREIGHT TRANSPORTATION ARRANGEMENT
      - "7389"  # SERVICES-SERVICES, NEC (logistics tech platforms)
      - "4522"  # AIR TRANSPORTATION, NONSCHEDULED
