envVarGroups:
  - name: filings-shared-secrets
    envVars:
      # Values set manually in the Render dashboard. Linked to every service
      # that needs Postgres + R2 image-cache access.
      - key: DATABASE_URL
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      # Sentry error-monitoring DSN. Errors-only, PII-scrubbed (src/infra/sentry.py).
      # In this group so it reaches exactly filings-reviewer, filings-extraction,
      # and filings-onboarding-runner — NOT nightly-sweep or metabase. Leave
      # unset to disable Sentry (init is a no-op without it).
      - key: SENTRY_DSN
        sync: false

  - name: filings-claude-secrets
    envVars:
      # Used only by the autonomous sweeper (filings-nightly-sweep cron). Kept
      # separate from filings-shared-secrets — no DB or R2 creds need to leak
      # into the sweeper's container.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GH_TOKEN
        sync: false

services:
  - type: web
    name: filings-reviewer
    region: ohio
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Run schema migrations before every deploy. The script is idempotent
    # (schema_migrations ledger) so this is safe on every push to main.
    # DATABASE_URL is available here via the filings-shared-secrets group below.
    preDeployCommand: python3 scripts/apply_migrations.py
    healthCheckPath: /health
    envVars:
      - fromGroup: filings-shared-secrets
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: FILINGS_API_KEY
        sync: false
      - key: INGEST_SPAWN_SUBPROCESS
        value: "false"  # production drains via filings-onboarding-runner worker
      - key: RETRAIN_SPAWN_SUBPROCESS
        value: "false"  # gh-400: retrain rows are claimed by filings-onboarding-runner
      - key: FILINGS_REVIEWER_ALLOW_PROD_WRITES
        value: "1"  # R2Storage.put_bytes guard — required for any service that writes image bytes

  - type: cron
    name: filings-extraction
    region: ohio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    dockerCommand: python3 scripts/batch_v2_extraction.py --status fetched --workers 1 --limit 50
    schedule: "0 6 * * *"  # Daily at 6am UTC
    envVars:
      - fromGroup: filings-shared-secrets
      - key: ENABLE_METRIC_CLASSIFY
        value: "true"  # Tripod Leg B (#92): Vision-API metric classify. Flipped 2026-05-04 per gh-441 (smoke-tested).
      - key: VISION_CLASSIFY_PROVIDER
        value: gemini
      - key: VISION_CLASSIFY_MODEL
        value: gemini-2.5-flash-lite  # 2026-04-23 bake-off winner
      - key: VISION_CLASSIFY_THRESHOLD
        value: "0.5"
      - key: GOOGLE_API_KEY
        sync: false  # Set manually in Render dashboard. NOTE: src/llm/providers/gemini.py reads GOOGLE_API_KEY (google-genai SDK convention), not GEMINI_API_KEY.
      - key: FILINGS_REVIEWER_ALLOW_PROD_WRITES
        value: "1"  # R2Storage.put_bytes guard — required; cron writes chart images via ocr_extraction.py
      - key: USE_LEARNED_TRIAGE
        value: "true"  # gh-442: gate extraction on learned image-relevance model (R2 pointer in models/image_relevance/latest_run_id.txt)
      - key: LEARNED_TRIAGE_MIN
        value: "0.32"  # gh-442: tuned slightly below cba5e60f model's 80%-recall threshold (0.341); P=0.094 / R~0.82

  - type: worker
    name: filings-onboarding-runner
    region: ohio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python3 -m src.universe.onboarding_runner --watch --poll-interval 10
    envVars:
      - fromGroup: filings-shared-secrets
      - key: SEC_USER_AGENT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FILINGS_REVIEWER_ALLOW_PROD_WRITES
        value: "1"  # R2Storage.put_bytes guard — required; worker writes images via ingestion.py
      # gh-469: mirror filings-extraction image-pipeline flags so ingest-path filings get scored.
      # onboarding.py calls process_filing() inline; without these, ingest produces
      # NULL predicted_relevance and zero v2_image_classifications rows.
      - key: USE_LEARNED_TRIAGE
        value: "true"  # gh-469: mirror filings-extraction
      - key: LEARNED_TRIAGE_MIN
        value: "0.32"  # gh-469: same threshold as filings-extraction (cba5e60f model 80%-recall threshold)
      - key: ENABLE_METRIC_CLASSIFY
        value: "true"  # gh-469: mirror filings-extraction; populate v2_image_classifications on ingest
      - key: VISION_CLASSIFY_PROVIDER
        value: gemini
      - key: VISION_CLASSIFY_MODEL
        value: gemini-2.5-flash-lite  # 2026-04-23 bake-off winner
      - key: VISION_CLASSIFY_THRESHOLD
        value: "0.5"
      - key: GOOGLE_API_KEY
        sync: false  # gh-469: must be set manually in Render dashboard. NOTE: src/llm/providers/gemini.py reads GOOGLE_API_KEY (google-genai SDK convention), not GEMINI_API_KEY.

  # Autonomous nightly sweeper for known-issue fragments in docs/known-issues/.
  # Reads frontmatter, picks up to 3 non-colliding safe/review issues, and
  # attempts to work each in an isolated worktree.
  # Safe issues auto-merge on green CI; review issues open draft PRs for
  # the morning review. See docs/operations/nightly-sweep-runbook.md.
  #
  # SAFETY: gated by `SWEEP_FORCE=1` in env group `filings-claude-secrets`.
  # Set to anything other than "1" (or unset) to pause all sweeps. The cron
  # still fires on schedule; the script exits 0 with a "sweeper disabled"
  # log line. No commit needed — Render env changes take effect next tick.
  - type: cron
    name: filings-nightly-sweep
    region: ohio
    runtime: docker
    dockerfilePath: ./Dockerfile.nightly-sweep
    dockerCommand: bash scripts/run_nightly_sweep.sh
    schedule: "0 6 * * *"  # Daily at 06:00 UTC (02:00 EDT / 02:00 EST)
    envVars:
      - fromGroup: filings-claude-secrets
      # Sweeper budgets (override defaults from run_nightly_sweep.sh).
      - key: SWEEP_MAX
        value: "5"
      - key: SWEEP_INCLUDE_REVIEW
        value: "0"  # safe-only by default; flip to 1 to allow review-tier holds
      - key: SWEEP_WALL_BUDGET
        value: "4500"  # 75 minutes total (5 issues x 15 min each)
      - key: SWEEP_PER_ISSUE
        value: "900"   # 15 minutes per issue
      # DB access for the proactive stall-check (scripts/check_stalled_runs.py).
      # Read-only queries only; no writes. Kept out of filings-shared-secrets
      # to avoid pulling in R2 creds. Set value in the Render UI (sync: false).
      - key: DATABASE_URL
        sync: false
      # Stall-check thresholds (optional; defaults applied in check_stalled_runs.py).
      - key: STALL_THRESHOLD_TEXT_MINS
        value: "30"   # minutes past started_at before a text_decision_analysis_runs row is flagged
      - key: STALL_THRESHOLD_LOCK_MINS
        value: "30"   # minutes past run_lock_until expiry before model_training/ingest rows are flagged

  # Self-hosted Metabase for browser-based query / visualization.
  # Points at Neon via the metabase_ro read-only role (sql/37_create_analytics_role.sql).
  # DB credentials (Neon URL + metabase_ro password) are configured inside the
  # Metabase admin UI after first login — NOT via env vars on this service —
  # so a shell on this container can't read them in plaintext.
  # See docs/operations/analytics-ui-runbook.md for setup + upgrade procedure.
  - type: web
    name: filings-metabase
    region: ohio
    runtime: image
    image:
      url: docker.io/metabase/metabase:v0.59.8
    # Standard (2 GB RAM) required — Metabase's JVM needs ~1 GB heap minimum;
    # Starter (512 MB) OOMs during the first-boot schema migration.
    plan: standard
    autoDeploy: false  # upgrades are deliberate; don't restart on every main push
    healthCheckPath: /api/health
    disk:
      name: metabase-data
      mountPath: /metabase-data
      sizeGB: 1
    envVars:
      - key: MB_DB_TYPE
        value: h2
      - key: MB_DB_FILE
        value: /metabase-data/metabase.db
      # Encrypts connection credentials at rest inside the H2 app DB. Must stay
      # stable across deploys — if rotated, stored Neon creds become unreadable
      # and must be re-entered in the Metabase admin UI.
      - key: MB_ENCRYPTION_SECRET_KEY
        generateValue: true
      # Set to the Render-assigned URL after first deploy (e.g.
      # https://filings-metabase.onrender.com). Required so Metabase emits
      # correct links in emails and share URLs.
      - key: MB_SITE_URL
        sync: false
      - key: MB_JETTY_PORT
        value: "3000"
