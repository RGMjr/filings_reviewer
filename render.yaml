services:
  - type: web
    name: filings-reviewer
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually — works with Neon or Render Postgres
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: FILINGS_API_KEY
        sync: false
      - key: INGEST_SPAWN_SUBPROCESS
        value: "false"  # production drains via filings-onboarding-runner worker
      # Cloudflare R2 image cache (src/infra/image_storage.py). Values set via Render dashboard.
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false

  - type: cron
    name: filings-extraction
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python3 scripts/batch_v2_extraction.py --status fetched --workers 2 --limit 50
    schedule: "0 6 * * *"  # Daily at 6am UTC
    envVars:
      - key: DATABASE_URL
        sync: false
      # Cron writes images to R2 — must share the same bucket credentials as the web service.
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false

  - type: worker
    name: filings-onboarding-runner
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python3 -m src.universe.onboarding_runner --watch --poll-interval 10
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Worker runs V2Pipeline for onboard batches — image OCR writes to R2.
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false

  # Autonomous nightly sweeper for docs/KNOWN_ISSUES.md. Parses the
  # "Nightly Sweeper Classification" table, picks up to 3 non-colliding
  # safe/review issues, and attempts to work each in an isolated worktree.
  # Safe issues auto-merge on green CI; review issues open draft PRs for
  # the morning review. See docs/operations/nightly-sweep-runbook.md.
  #
  # SAFETY: .claude/sweep.pause (committed) halts all sweeps until deleted.
  # Remove that file to activate the sweeper.
  - type: cron
    name: filings-nightly-sweep
    runtime: docker
    dockerfilePath: ./Dockerfile.nightly-sweep
    dockerCommand: bash scripts/run_nightly_sweep.sh
    schedule: "0 6 * * *"  # Daily at 06:00 UTC (02:00 EDT / 02:00 EST)
    envVars:
      # No DB or R2 creds — the sweeper only touches code + GitHub.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GH_TOKEN
        sync: false
      # Sweeper budgets (override defaults from run_nightly_sweep.sh).
      - key: SWEEP_MAX
        value: "3"
      - key: SWEEP_INCLUDE_REVIEW
        value: "0"  # safe-only by default; flip to 1 to allow review-tier holds
      - key: SWEEP_WALL_BUDGET
        value: "2700"  # 45 minutes total
      - key: SWEEP_PER_ISSUE
        value: "900"   # 15 minutes per issue
