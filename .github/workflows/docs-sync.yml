name: Documentation Sync

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CLAUDE.md'
      - 'README.md'

jobs:
  check-docs:
    name: Check Documentation Freshness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run documentation sync check
        run: |
          python scripts/check_docs_sync.py --ci

      - name: Check for stale coverage
        id: coverage
        continue-on-error: true
        run: |
          # Run tests and capture coverage
          pytest --cov=src --cov-report=term -q --tb=no 2>/dev/null | tee coverage.txt

          # Extract actual coverage
          ACTUAL=$(grep TOTAL coverage.txt | awk '{print $4}' | tr -d '%')
          echo "actual_coverage=$ACTUAL" >> $GITHUB_OUTPUT

          # Extract claimed coverage from README
          CLAIMED=$(grep -oP '\d+(?=%\s*overall)' README.md | head -1)
          echo "claimed_coverage=$CLAIMED" >> $GITHUB_OUTPUT

          # Check difference
          DIFF=$((ACTUAL - CLAIMED))
          if [ ${DIFF#-} -gt 5 ]; then
            echo "::warning::README claims ${CLAIMED}% coverage but actual is ${ACTUAL}%"
          fi

  update-coverage:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    needs: check-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update coverage in README
        run: |
          # Get actual coverage
          COVERAGE=$(pytest --cov=src --cov-report=term -q --tb=no 2>/dev/null | grep TOTAL | awk '{print $4}' | tr -d '%')

          if [ -n "$COVERAGE" ]; then
            # Update README
            sed -i "s/Test Coverage:\*\* [0-9]*%/Test Coverage:** ${COVERAGE}%/" README.md

            # Check if changed
            if git diff --quiet README.md; then
              echo "Coverage unchanged"
            else
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add README.md
              git commit -m "docs: update test coverage to ${COVERAGE}%"
              git push
            fi
          fi
