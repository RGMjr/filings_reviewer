name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/ scripts/

      - name: Type check (mypy)
        run: uv run mypy src/review/ --strict

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -n auto -x -q --tb=short --cov=src --cov-fail-under=75

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Audit dependencies
        run: uv run pip-audit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filings_analysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filings_analysis_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        run: uv run python3 scripts/apply_migrations.py --test

      - name: Run integration tests
        run: >-
          uv run pytest tests/integration/ -x -q --tb=short --no-cov
          --ignore=tests/integration/test_gold_standard_regression.py
          --ignore=tests/integration/test_gold_standard_coverage.py

  docker-build-test:
    name: Docker Build & Smoke
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filings_analysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filings_analysis_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        run: uv run python3 scripts/apply_migrations.py --test

      - name: Build Docker image
        run: docker build -t filings-reviewer-test .

      - name: Start container
        run: >-
          docker run -d --name filings-reviewer-smoke
          --network=host
          -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/filings_analysis_test
          -e SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          -e FILINGS_API_KEY=ci-test-api-key
          -e APP_ENV=production
          -e PORT=8080
          filings-reviewer-test

      - name: Wait for healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health; then
              echo ""
              echo "Container is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for container health check"
          docker logs filings-reviewer-smoke
          exit 1

      - name: Run deployment tests
        run: >-
          uv run pytest tests/deployment/ -m deployment -v --tb=short --no-cov
        env:
          SMOKE_TEST_BASE_URL: http://localhost:8080
          SMOKE_TEST_API_KEY: ci-test-api-key

      - name: Verify non-root user
        run: |
          USER=$(docker exec filings-reviewer-smoke whoami)
          test "$USER" = "appuser" || (echo "Expected appuser, got $USER" && exit 1)

      - name: Collect container logs on failure
        if: failure()
        run: docker logs filings-reviewer-smoke 2>&1 || true

      - name: Cleanup container
        if: always()
        run: docker rm -f filings-reviewer-smoke 2>/dev/null || true

  deploy-smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, docker-build-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Wait for Render deploy
        run: sleep 120

      - name: Run smoke tests against live deployment
        run: >-
          uv run pytest tests/deployment/test_smoke.py -m deployment -v --tb=short --no-cov
        env:
          SMOKE_TEST_BASE_URL: https://filings-reviewer.onrender.com
          SMOKE_TEST_API_KEY: ${{ secrets.FILINGS_API_KEY }}

  gold-standard:
    name: Gold Standard Validation
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filings_analysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filings_analysis_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        run: uv run python3 scripts/apply_migrations.py --test

      - name: Run gold standard validation
        run: uv run pytest -m gold_standard --gold-standard-mode=fresh -v --tb=short --no-cov

      - name: Upload gold standard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-standard-results-${{ github.run_id }}
          path: |
            data/gold_standard/
            .pytest_cache/
          retention-days: 30
