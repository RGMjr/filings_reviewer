name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/ scripts/

      - name: Type check (mypy)
        run: uv run mypy src/review/ --strict

      - name: Known-issues fragments validate
        # Phase 2: the rollup is no longer tracked in git. Fragments are the
        # source of truth; this lint just confirms they parse cleanly.
        run: uv run python3 scripts/regenerate_known_issues.py --validate

  # Known-issues rollup artifact: regenerate and publish the rollup as a
  # build artifact on every CI run. Fragments in docs/known-issues/ are
  # the source of truth; the rollup is derived.
  known-issues-artifact:
    name: Known-issues rollup artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Regenerate rollup to temp path
        run: uv run python3 scripts/regenerate_known_issues.py --output /tmp/KNOWN_ISSUES.md

      - name: Upload rollup artifact
        uses: actions/upload-artifact@v7
        with:
          name: known-issues-rollup
          path: /tmp/KNOWN_ISSUES.md
          retention-days: 30
          if-no-files-found: error

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -n auto -x -q --tb=short --cov=src --cov-fail-under=75

  ui-e2e:
    name: UI E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for UI-relevant changes
        id: filter
        # Skip Playwright when EVERY changed path is in the docs/skills/meta
        # allowlist. Any src/, tests/, config/, sql/, requirements*, pyproject,
        # uv.lock, or .github/workflows change still runs the full Playwright
        # suite. Conservative — err toward running when in doubt.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD^"
          fi
          if git diff --name-only "$base"...HEAD \
              | grep -vE '^(docs/|\.claude/|CLAUDE\.md|README\.md|\.gitignore|\.github/CODEOWNERS)' \
              | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=UI E2E skipped::No UI-relevant paths changed."
          fi

      - uses: actions/setup-node@v6
        if: steps.filter.outputs.run == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - uses: astral-sh/setup-uv@v7
        if: steps.filter.outputs.run == 'true'

      - name: Install Python dependencies
        if: steps.filter.outputs.run == 'true'
        run: uv sync --extra dev

      - name: Install Node dependencies
        if: steps.filter.outputs.run == 'true'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.filter.outputs.run == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chrome
        if: steps.filter.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chrome

      - name: Install Playwright system deps
        if: steps.filter.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chrome

      - name: Run Playwright tests
        if: steps.filter.outputs.run == 'true'
        working-directory: tests/ui
        shell: bash
        # webServer command in playwright.config.js invokes `python3 test_server.py`
        # directly; prepend the uv-managed venv to PATH so it finds Flask et al.
        run: |
          export PATH="${{ github.workspace }}/.venv/bin:$PATH"
          npx playwright test

      - name: Upload Playwright report on failure
        if: failure() && steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/ui/playwright-report/
            tests/ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Audit dependencies
        # Temporarily ignoring CVE-2026-3219 (pip 26.0.1). No fix version
        # published by upstream yet; pip-audit would block every PR on a
        # vulnerability we cannot remediate. Remove this ignore once a
        # patched pip is released.
        run: uv run pip-audit --ignore-vuln CVE-2026-3219

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filings_analysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filings_analysis_test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for integration-relevant changes
        id: filter
        # Skip Postgres + migrations when EVERY changed path is in the docs/skills/meta
        # allowlist. Any src/, tests/, config/, sql/, requirements*, pyproject,
        # uv.lock, or .github/workflows change still runs the full suite.
        # Conservative — err toward running when in doubt.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD^"
          fi
          if git diff --name-only "$base"...HEAD \
              | grep -vE '^(docs/|\.claude/|CLAUDE\.md|README\.md|\.gitignore|\.github/CODEOWNERS)' \
              | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Integration Tests skipped::No integration-relevant paths changed."
          fi

      - uses: astral-sh/setup-uv@v7
        if: steps.filter.outputs.run == 'true'

      - name: Install dependencies
        if: steps.filter.outputs.run == 'true'
        run: uv sync --extra dev

      - name: Apply migrations
        if: steps.filter.outputs.run == 'true'
        run: uv run python3 scripts/apply_migrations.py --test

      - name: Link-integrity check
        if: steps.filter.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run python3 scripts/validate_database_urls.py --fail-on-errors

      - name: Chart-image referential integrity
        if: steps.filter.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run python3 scripts/check_image_referential_integrity.py

      - name: Run integration tests
        if: steps.filter.outputs.run == 'true'
        run: >-
          uv run pytest tests/integration/ -n auto -x -q --tb=short --no-cov
          --ignore=tests/integration/test_gold_standard_regression.py
          --ignore=tests/integration/test_gold_standard_coverage.py

  docker-build-test:
    name: Docker Build & Smoke
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filings_analysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filings_analysis_test
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        run: uv run python3 scripts/apply_migrations.py --test

      - name: Build Docker image
        run: docker build -t filings-reviewer-test .

      - name: Start container
        run: >-
          docker run -d --name filings-reviewer-smoke
          --network=host
          -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/filings_analysis_test
          -e SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          -e FILINGS_API_KEY=ci-test-api-key
          -e APP_ENV=production
          -e PORT=8080
          filings-reviewer-test

      - name: Wait for healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health; then
              echo ""
              echo "Container is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for container health check"
          docker logs filings-reviewer-smoke
          exit 1

      - name: Run deployment tests
        run: >-
          uv run pytest tests/deployment/ -m deployment -v --tb=short --no-cov
        env:
          SMOKE_TEST_BASE_URL: http://localhost:8080
          SMOKE_TEST_API_KEY: ci-test-api-key

      - name: Verify non-root user
        run: |
          USER=$(docker exec filings-reviewer-smoke whoami)
          test "$USER" = "appuser" || (echo "Expected appuser, got $USER" && exit 1)

      - name: Collect container logs on failure
        if: failure()
        run: docker logs filings-reviewer-smoke 2>&1 || true

      - name: Cleanup container
        if: always()
        run: docker rm -f filings-reviewer-smoke 2>/dev/null || true

  deploy-smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, docker-build-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Wait for Render deploy
        run: sleep 120

      - name: Run smoke tests against live deployment
        run: >-
          uv run pytest tests/deployment/test_smoke.py -m deployment -v --tb=short --no-cov
        env:
          SMOKE_TEST_BASE_URL: https://filings-reviewer.onrender.com
          SMOKE_TEST_API_KEY: ${{ secrets.FILINGS_API_KEY }}
