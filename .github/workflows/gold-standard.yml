name: Gold Standard Validation

# Trigger on PRs that modify extraction-related files
on:
  pull_request:
    paths:
      - 'src/extraction/**'
      - 'src/extraction_v2/**'
      - 'config/metric_keywords.yaml'
      - 'config/metric_keywords/**'

jobs:
  gold-standard-check:
    name: Gold Standard Regression Check
    runs-on: ubuntu-latest
    # Non-blocking: always continue even if this fails
    continue-on-error: true

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filings_analysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filings_analysis_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        run: uv run python3 scripts/apply_migrations.py --test

      - name: Run gold standard validation
        id: gold-standard
        continue-on-error: true
        run: |
          uv run pytest -m gold_standard --gold-standard-mode=fresh -v --tb=short 2>&1 | tee gold_standard_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Report results
        run: |
          if [ "${{ steps.gold-standard.outputs.exit_code }}" != "0" ]; then
            echo "::warning file=src/extraction::Gold standard validation detected potential regressions. Review the test output before merging."
            echo "## Gold Standard Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** Warning - Potential regression detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This is a non-blocking check. Please review the gold standard output to ensure extraction quality is maintained." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Actions to Consider" >> $GITHUB_STEP_SUMMARY
            echo "- If intentional: Update baseline with \`pytest -m gold_standard --gold-standard-mode=fresh --update-baseline\`" >> $GITHUB_STEP_SUMMARY
            echo "- If unintentional: Review changes to extraction logic" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Gold Standard Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** Passed - No regressions detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-standard-output
          path: gold_standard_output.txt
          retention-days: 7
