name: V2 CI

on:
  push:
    branches:
      - v2-rewrite
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "sql/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/v2-ci.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/ scripts/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -x -q --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filings_analysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filings_analysis_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        run: uv run python3 scripts/apply_migrations.py --test

      - name: Run integration tests
        run: >-
          uv run pytest tests/integration/ -x -q --tb=short
          --ignore=tests/integration/test_gold_standard_regression.py
          --ignore=tests/integration/test_gold_standard_coverage.py

  gold-standard:
    name: Gold Standard Validation
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filings_analysis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filings_analysis_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        run: uv run python3 scripts/apply_migrations.py --test

      - name: Run gold standard validation
        run: uv run pytest -m gold_standard --gold-standard-mode=fresh -v --tb=short

      - name: Upload gold standard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-standard-results-${{ github.run_id }}
          path: |
            data/gold_standard/
            .pytest_cache/
          retention-days: 30
