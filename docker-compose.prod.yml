# Production docker-compose
# Expects a managed Postgres via DATABASE_URL — no DB service included.
#
# Usage:
#   cp .env.template .env          # fill in DATABASE_URL, SECRET_KEY, etc.
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up
#
# Build targets: web (Flask/Waitress on :8000), worker (extraction job runner)

services:
  web:
    build:
      context: .
      target: web
    image: filings-reviewer-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      LLM_CACHE_BACKEND: postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "uv", "run", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      target: worker
    image: filings-reviewer-worker
    env_file:
      - .env
    environment:
      APP_ENV: production
      LLM_CACHE_BACKEND: postgres
    restart: unless-stopped
    # No port exposure — worker is internal only
